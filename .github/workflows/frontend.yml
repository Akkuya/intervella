name: Frontend

on:
  push:
    branches: [main, 'feat/**']
    paths: ['vercel.json', '.vercelignore', 'deploy/**', '.github/workflows/staging.yml', 'frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['vercel.json', '.vercelignore', 'deploy/**', '.github/workflows/staging.yml', 'frontend/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python ../backend/verify_public_build.py dist
      - run: npm run build:operator
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: frontend-browser-results
          path: frontend/test-results/
          retention-days: 7
