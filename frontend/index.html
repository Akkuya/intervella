<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Check scheduled classroom availability with Toronto times and honest data freshness."
    />
    <meta name="theme-color" content="#142c45" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(() => {
        let choice = 'system'
        try {
          const saved = localStorage.getItem('utscvacant.appearance')
          if (saved === 'light' || saved === 'dark') choice = saved
        } catch {}
        document.documentElement.dataset.appearance = choice
        document.documentElement.dataset.theme =
          choice === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : choice
      })()
    </script>
    <title>UTSCVacant · Room to focus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
