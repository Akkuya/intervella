[project]
name = "backend"
version = "0.1.0"
description = "Intervella scheduled classroom availability API and private local ingestion"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17,<2",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "sqlmodel>=0.0.44",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "poethepoet>=0.41.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload"
dev-host = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy ."
test = "pytest"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["postgres: real PostgreSQL integration tests (requires TEST_DATABASE_URL)"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true
exclude = [".venv"]
