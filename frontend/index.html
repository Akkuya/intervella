<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Intervella helps UTSC students find spaces between classes using published timetable coverage. Independent student project; access and vacancy are not guaranteed."
    />
    <meta name="theme-color" content="#102f3c" />
    <link rel="icon" type="image/svg+xml" href="/assets/intervella.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Intervella" />
    <meta property="og:title" content="Intervella · Find your space between classes" />
    <meta
      property="og:description"
      content="Scheduled classroom availability for UTSC students. Independent student project; no guarantee of access or vacancy."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(() => {
        let choice = 'system'
        try {
          const saved = localStorage.getItem('utscvacant.appearance')
          if (saved === 'light' || saved === 'dark') choice = saved
        } catch {}
        document.documentElement.dataset.appearance = choice
        document.documentElement.dataset.theme =
          choice === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : choice
      })()
    </script>
    <title>Intervella · Find your space between classes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
